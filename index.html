return{data,estado,dep,escola,tipo:dep.startsWith("Privada")?"Privada":"Pública",niveis,total:niveis.reduce((s,v)=>s+v,0)};
});
let filterEstado="Todos",filterDep="Todos",filterNivel=0,search="",activeTab="overview";
function getRows(){
let r=ALL_ROWS;
if(filterEstado!=="Todos")r=r.filter(x=>x.estado===filterEstado);

}
function svgBar(data,opts){
const{w=600,h=220,color=C.blue,horizontal=false,selectedName=null,onClickData=null}=opts||{};
if(!data.length)return'<svg></svg>';
const max=Math.max(...data.map(d=>d.value));
const PAD={t:10,r:40,b:30,l:horizontal?150:40};
const W=w-PAD.l-PAD.r,H=h-PAD.t-PAD.b;
let bars="",labels="",grid="";
if(horizontal){
const bh=Math.min(22,H/data.length-4);
const gap=(H/data.length);
data.forEach((d,i)=>{
const bw=max>0?(d.value/max)*W:0;
const y=PAD.t+i*gap+(gap-bh)/2;
const fill=selectedName===d.name?C.orange:(i===0?C.navy:C.blue);
const cursor=onClickData?"cursor:pointer":"";
bars+=`<rect x="${PAD.l}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${fill}" style="${cursor}" data-name="${d.name}"/>`;
labels+=`<text x="${PAD.l-6}" y="${y+bh/2+4}" text-anchor="end" font-size="11" fill="${C.navy}" font-weight="600">${d.name}</text>`;
labels+=`<text x="${PAD.l+bw+5}" y="${y+bh/2+4}" font-size="11" fill="${C.muted}">${d.value.toLocaleString("pt-BR")}</text>`;
});
[0,.25,.5,.75,1].forEach(p=>{
const x=PAD.l+p*W;
grid+=`<line x1="${x}" y1="${PAD.t}" x2="${x}" y2="${PAD.t+H}" stroke="#F0F0F5" stroke-width="1"/>`;
grid+=`<text x="${x}" y="${PAD.t+H+14}" text-anchor="middle" font-size="10" fill="${C.muted}">${Math.round(max*p).toLocaleString("pt-BR")}</text>`;
});
} else {
const bw=Math.min(60,W/data.length-8);
const gap=W/data.length;
[0,.25,.5,.75,1].forEach(p=>{
const y=PAD.t+H*(1-p);
grid+=`<line x1="${PAD.l}" y1="${y}" x2="${PAD.l+W}" y2="${y}" stroke="#F0F0F5" stroke-width="1"/>`;
if(p>0)grid+=`<text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="10" fill="${C.muted}">${Math.round(max*p).toLocaleString("pt-BR")}</text>`;
});
data.forEach((d,i)=>{
const bh=max>0?(d.value/max)*H:0;
const x=PAD.l+i*gap+(gap-bw)/2;
const y=PAD.t+H-bh;
const COLORS=[C.navy,C.blue,C.orange,C.red,C.green];
bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${COLORS[i%COLORS.length]}"/>`;
labels+=`<text x="${x+bw/2}" y="${PAD.t+H+18}" text-anchor="middle" font-size="11" fill="${C.muted}">${d.name}</text>`;
labels+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="10" fill="${C.navy}">${d.value.toLocaleString("pt-BR")}</text>`;
});
}
return`<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible;">${grid}${bars}${labels}</svg>`;
}
function svgLine(data,opts){
const{w=600,h=200,color=C.blue,refLine=null,refLabel=""}=opts||{};
if(!data.length)return'<svg></svg>';
const max=Math.max(...data.map(d=>d.value),refLine||0)*1.05;
const PAD={t:20,r:20,b:40,l:50};
const W=w-PAD.l-PAD.r,H=h-PAD.t-PAD.b;
const px=(i)=>PAD.l+i*(W/(data.length-1||1));
const py=(v)=>PAD.t+H-(v/max)*H;
let points=data.map((d,i)=>`${px(i)},${py(d.value)}`).join(" ");
let grid="",xlabels="",ref="";
[0,.25,.5,.75,1].forEach(p=>{
const y=PAD.t+H*(1-p);
grid+=`<line x1="${PAD.l}" y1="${y}" x2="${PAD.l+W}" y2="${y}" stroke="#F0F0F5" stroke-width="1"/>`;
grid+=`<text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="10" fill="${C.muted}">${Math.round(max*p).toLocaleString("pt-BR")}</text>`;
});
data.forEach((d,i)=>{
if(i%4===0||i===data.length-1){
xlabels+=`<text x="${px(i)}" y="${PAD.t+H+24}" text-anchor="middle" font-size="9" fill="${C.muted}" transform="rotate(-30,${px(i)},${PAD.t+H+24})">${d.name}</text>`;
}
});
if(refLine!=null){
const ry=py(refLine);
ref+=`<line x1="${PAD.l}" y1="${ry}" x2="${PAD.l+W}" y2="${ry}" stroke="${C.red}" stroke-width="1.5" stroke-dasharray="6,3"/>`;
ref+=`<text x="${PAD.l+W}" y="${ry-4}" text-anchor="end" font-size="10" fill="${C.red}">${refLabel}</text>`;
}
return`<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible;">${grid}${ref}<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${xlabels}</svg>`;
}
function svgPie(data,colors,w=260,h=180){
const cx=w/2,cy=h/2-10,r=Math.min(w,h)/2-30,ri=r*0.4;
const total=data.reduce((s,d)=>s+d.value,0);
if(!total)return'<svg></svg>';
let path="",legend="";
let angle=-Math.PI/2;
data.forEach((d,i)=>{
const slice=(d.value/total)*2*Math.PI;
const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
const x2=cx+r*Math.cos(angle+slice),y2=cy+r*Math.sin(angle+slice);
const xi1=cx+ri*Math.cos(angle),yi1=cy+ri*Math.sin(angle);
const xi2=cx+ri*Math.cos(angle+slice),yi2=cy+ri*Math.sin(angle+slice);
const lg=slice>Math.PI?1:0;
const pct=Math.round((d.value/total)*100);
const lx=cx+(r+15)*Math.cos(angle+slice/2),ly=cy+(r+15)*Math.sin(angle+slice/2);
path+=`<path d="M${xi1},${yi1} L${x1},${y1} A${r},${r} 0 ${lg},1 ${x2},${y2} L${xi2},${yi2} A${ri},${ri} 0 ${lg},0 ${xi1},${yi1}" fill="${colors[i%colors.length]}"/>`;
if(pct>5)path+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${pct}%</text>`;
legend+=`<rect x="4" y="${h-20+i*16}" width="10" height="10" rx="2" fill="${colors[i%colors.length]}"/>`;
legend+=`<text x="18" y="${h-12+i*16}" font-size="11" fill="${C.muted}">${d.name}: <tspan font-weight="600" fill="${C.navy}">${d.value.toLocaleString("pt-BR")}</tspan></text>`;
angle+=slice;
});
return`<svg viewBox="0 0 ${w} ${h+data.length*16}" width="100%">${path}${legend}</svg>`;
}
function progressBar(label,current,meta,color){
const pct=Math.min(100,(current/meta)*100);
const faltam=Math.max(0,meta-current);
return`<div class="progress-wrap">
<div class="progress-label"><span style="color:${C.muted};text-transform:uppercase;letter-spacing:1px;">${label}</span><span style="font-weight:700;color:${pct>=100?C.green:C.navy};">${pct.toFixed(1)}%</span></div>
<div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${pct>=100?C.green:color};"></div></div>
<div class="progress-meta"><span style="font-weight:600;">${current.toLocaleString("pt-BR")} inscritos</span><span style="color:${C.muted};">meta: ${meta.toLocaleString("pt-BR")} · faltam ${faltam.toLocaleString("pt-BR")}</span></div>
</div>`;
}
function diasRestantes(){
const enc=new Date(2026,6,10);
return Math.max(0,Math.ceil((enc-new Date())/(864e5)));
}
function buildTimeline(rows){
const order=["10/04","14/04","16/04","17/04","18/04","22/04","23/04","24/04","27/04","28/04","29/04","04/05","05/05","06/05","07/05","08/05","13/05","15/05","17/05","18/05","19/05","20/05","21/05","22/05","27/05","28/05","29/05","01/06","03/06","05/06","06/06","07/06","08/06","09/06","10/06","11/06","12/06","15/06","16/06","17/06","18/06","19/06","20/06","21/06","22/06","23/06","24/06","25/06","26/06","27/06","28/06","29/06","30/06","01/07","05/07"];
const byDate={};order.forEach(d=>byDate[d]=0);
rows.forEach(r=>{if(byDate[r.data]!==undefined)byDate[r.data]+=r.total;});
const daily=Object.entries(byDate).filter(([,v])=>v>0).map(([name,value])=>({name,value}));
let cum=0;
const cumul=daily.map(d=>{cum+=d.value;return{name:d.name,value:cum};});
return{daily,cumul};
}
function render(){
const rows=getRows();
const totalInsc=rows.reduce((s,r)=>s+r.total,0);
const nEstados=new Set(rows.map(r=>r.estado)).size;
const totalPub=rows.filter(r=>r.tipo==="Pública").reduce((s,r)=>s+r.total,0);
const totalPriv=rows.filter(r=>r.tipo==="Privada").reduce((s,r)=>s+r.total,0);
const dias=diasRestantes();
const pctGlobal=((totalInsc/META_GLOBAL)*100).toFixed(1);
const badgeColor=dias<=7?C.red:dias<=14?C.orange:C.green;
document.getElementById("countdown-badge").style.background=badgeColor;
document.getElementById("countdown-badge").textContent=`⏱ ${dias} dias para encerrar · ${ENCERRAMENTO}`;
document.getElementById("update-label").textContent=`Atualizado em ${ATUALIZACAO}`;
const kpis=[
{label:"Total de Inscritos",value:totalInsc.toLocaleString("pt-BR"),accent:C.navy,sub:`${pctGlobal}% da meta global`},
{label:"Escolas Públicas",value:rows.filter(r=>r.tipo==="Pública").length,accent:C.blue,sub:`${totalPub.toLocaleString("pt-BR")} inscritos`},
{label:"Escolas Privadas",value:rows.filter(r=>r.tipo==="Privada").length,accent:C.orange,sub:`${totalPriv.toLocaleString("pt-BR")} inscritos`},
{label:"Estados",value:nEstados,accent:C.red,sub:""},
{label:"Dias restantes",value:dias,accent:dias<=14?C.red:C.green,sub:`Encerra em ${ENCERRAMENTO}`},
];
document.getElementById("kpi-row").innerHTML=kpis.map(k=>`
<div class="kpi" style="border-left-color:${k.accent};">
<div class="kpi-label">${k.label}</div>
<div class="kpi-value">${k.value}</div>
${k.sub?`<div class="kpi-sub">${k.sub}</div>`:""}
</div>`).join("");
const sumBy=(key)=>{
const m={};rows.forEach(r=>{m[r[key]]=(m[r[key]]||0)+r.total;});
return Object.entries(m).map(([name,value])=>({name,value})).sort((a,b)=>b.value-a.value);
};
const nivelData=[1,2,3,4,5].map(i=>({name:`N${i}`,value:rows.reduce((s,r)=>s+r.niveis[i-1],0)})).filter(d=>d.value>0);
const estadoData=sumBy("estado").slice(0,15);
const depData=sumBy("dep");
const pubPriv=[{name:"Pública",value:totalPub},{name:"Privada",value:totalPriv}];
const{daily,cumul}=buildTimeline(rows);
const escolaMap={};
rows.forEach(r=>{
const k=r.escola+"|"+r.estado;
if(!escolaMap[k])escolaMap[k]={escola:r.escola,estado:r.estado,tipo:r.tipo,total:0};
escolaMap[k].total+=r.total;
});
const top10=Object.values(escolaMap).sort((a,b)=>b.total-a.total).slice(0,10);
if(activeTab==="overview"){
document.getElementById("tab-overview").innerHTML=`
<div class="card" style="margin-bottom:12px;">
<div class="card-title">Evolução de Inscrições
<span style="font-size:11px;color:${C.muted};">Encerra: <strong style="color:${C.red};">${ENCERRAMENTO}</strong></span>
</div>
${svgLine(cumul,{w:900,h:200,color:C.blue,refLine:META_GLOBAL,refLabel:"Meta 57.600"})}
</div>
<div class="row">
<div class="card" style="max-width:290px;">
<div class="card-title">Pública × Privada</div>
${svgPie(pubPriv,[C.blue,C.orange])}
</div>
<div class="card">
<div class="card-title">Por Nível</div>
${svgBar(nivelData,{w:500,h:200})}
</div>
<div class="card" style="max-width:260px;">
<div class="card-title">Dependência Administrativa</div>
${svgPie(depData,[C.navy,C.blue,C.orange,C.red])}
</div>
</div>
<div class="row">
<div class="card" id="estado-card">
<div class="card-title">Inscritos por Estado</div>
<div id="estado-chart">${svgBar(estadoData,{w:700,h:Math.max(260,estadoData.length*30),horizontal:true,selectedName:filterEstado,onClickData:true})}</div>
</div>
<div class="card" style="min-width:300px;max-width:380px;">
<div class="card-title">Top 10 Escolas</div>
${top10.map((e,i)=>`
<div class="top10-item" style="background:${i===0?"#F0F4FF":C.gray};">
<span style="font-size:12px;font-weight:700;color:${C.muted};min-width:22px;">#${i+1}</span>
<div style="flex:1;min-width:0;">
<div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${e.escola}</div>
<div style="font-size:10px;color:${C.muted};">${e.estado}</div>
</div>
<span class="tag" style="background:${e.tipo==="Privada"?C.orange+"22":C.blue+"22"};color:${e.tipo==="Privada"?C.orange:C.blue};">${e.tipo}</span>
<span style="font-size:13px;font-weight:700;min-width:44px;text-align:right;">${e.total.toLocaleString("pt-BR")}</span>
</div>`).join("")}
</div>
</div>`;
document.getElementById("estado-chart").querySelectorAll("rect[data-name]").forEach(el=>{
el.addEventListener("click",()=>{
const name=el.getAttribute("data-name");
filterEstado=filterEstado===name?"Todos":name;
document.getElementById("filter-estado").value=filterEstado;
updateClearBtn();render();
});
});
}
if(activeTab==="metas"){
const ritmoNec=dias>0?Math.ceil((META_GLOBAL-totalInsc)/dias):0;
const ritmoAtual=Math.round(totalInsc/56);
document.getElementById("tab-metas").innerHTML=`
<div class="row">
<div class="card" style="max-width:500px;">
<div class="card-title">Progresso em relação às metas</div>
${progressBar("Meta Global",totalInsc,META_GLOBAL,C.navy)}
${progressBar("Escolas Públicas",totalPub,META_PUBLICA,C.blue)}
${progressBar("Escolas Privadas",totalPriv,META_PRIVADA,C.orange)}
<div class="info-box">
<strong>Ritmo necessário:</strong><br/>
Para atingir a meta em ${dias} dias: <strong>${ritmoNec.toLocaleString("pt-BR")} inscritos/dia</strong>.<br/>
Ritmo atual: <strong>${ritmoAtual.toLocaleString("pt-BR")} inscritos/dia</strong> (desde 10/04).
</div>
</div>
<div class="card">
<div class="card-title">Acumulado vs Meta</div>
${svgLine(cumul,{w:700,h:260,color:C.navy,refLine:META_GLOBAL,refLabel:"Meta 57.600"})}
</div>
</div>`;
}
if(activeTab==="tabela"){
const tableRows=rows.filter(r=>!search||r.escola.toLowerCase().includes(search.toLowerCase())||r.estado.toLowerCase().includes(search.toLowerCase()));
document.getElementById("tab-tabela").innerHTML=`
<div class="card">
<div class="card-title">Todas as entradas (${tableRows.length})
<input class="search-input" placeholder="Buscar escola ou estado..." value="${search}" id="search-input"/>
</div>
<div style="overflow-x:auto;">
<table>
<thead><tr>
<th>Data</th><th>Escola</th><th>Estado</th><th>Tipo</th>
<th class="right">N1</th><th class="right">N2</th><th class="right">N3</th><th class="right">N4</th><th class="right">N5</th><th class="right">Total</th>
</tr></thead>
<tbody>${tableRows.map((r,i)=>`<tr>
<td style="color:${C.muted};white-space:nowrap;">${r.data}</td>
<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;">${r.escola}</td>
<td style="color:${C.muted};white-space:nowrap;">${r.estado}</td>
<td><span class="tag" style="background:${r.tipo==="Privada"?C.orange+"22":C.blue+"22"};color:${r.tipo==="Privada"?C.orange:C.blue};">${r.dep.replace("Pública ","")}</span></td>
${r.niveis.map(v=>`<td class="right" style="color:${v>0?C.navy:C.light};">${v>0?v.toLocaleString("pt-BR"):"—"}</td>`).join("")}
<td class="right" style="font-weight:700;">${r.total.toLocaleString("pt-BR")}</td>
</tr>`).join("")}
</tbody>
</table>
${tableRows.length===0?'<div style="text-align:center;padding:32px;color:#8890A6;">Nenhuma escola encontrada.</div>':""}
</div>
</div>`;
document.getElementById("search-input").addEventListener("input",e=>{search=e.target.value;render();});
}
document.getElementById("footer").textContent=`${rows.length} envios · ${totalInsc.toLocaleString("pt-BR")} inscritos · ${nEstados} estados · OBEF 2026 · encerramento ${ENCERRAMENTO}`;
}
function updateClearBtn(){
const active=filterEstado!=="Todos"||filterDep!=="Todos"||filterNivel>0;
document.getElementById("clear-btn").style.display=active?"inline-block":"none";
}
const estados=[...new Set(ALL_ROWS.map(r=>r.estado))].sort();
const deps=[...new Set(ALL_ROWS.map(r=>r.dep))].sort();
const esel=document.getElementById("filter-estado");
estados.forEach(e=>{const o=document.createElement("option");o.value=e;o.textContent=e;esel.appendChild(o);});
const dsel=document.getElementById("filter-dep");
deps.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=d;dsel.appendChild(o);});
esel.addEventListener("change",e=>{filterEstado=e.target.value;updateClearBtn();render();});
dsel.addEventListener("change",e=>{filterDep=e.target.value;updateClearBtn();render();});
document.getElementById("filter-nivel").addEventListener("change",e=>{filterNivel=Number(e.target.value);updateClearBtn();render();});
document.getElementById("clear-btn").addEventListener("click",()=>{
filterEstado="Todos";filterDep="Todos";filterNivel=0;
esel.value="Todos";dsel.value="Todos";document.getElementById("filter-nivel").value="0";
updateClearBtn();render();
});
document.querySelectorAll(".tab-btn").forEach(btn=>{
btn.addEventListener("click",()=>{
activeTab=btn.dataset.tab;
document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
["overview","metas","tabela"].forEach(t=>document.getElementById("tab-"+t).style.display=t===activeTab?"block":"none");
render();
});
});
render();
</script>
</body>
</html>
